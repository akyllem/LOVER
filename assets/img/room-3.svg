    <rect x="148" y="200" width="26" height="156" fill="#7a5a32"/>
    <rect x="178" y="220" width="20" height="136" fill="#c8a16a"/>
    <rect x="202" y="200" width="22" height="156" fill="#3a4a3e"/>
    <rect x="228" y="230" width="18" height="126" fill="#dccfaf"/>
