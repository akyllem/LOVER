    <rect x="326" y="200" width="24" height="156" fill="#7a5a32"/>
    <rect x="354" y="210" width="20" height="146" fill="#506b5b"/>
    <rect x="378" y="200" width="22" height="156" fill="#c8a16a"/>
    <rect x="404" y="220" width="20" height="136" fill="#3a4a3e"/>
    <rect x="428" y="200" width="24" height="156" fill="#dccfaf"/>
