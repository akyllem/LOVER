<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Reading nook with armchair and bookshelf">
  <defs>
    <linearGradient id="r3wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a3e"/>
      <stop offset="1" stop-color="#2a3b32"/>
