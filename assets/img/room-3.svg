  <g>
    <rect x="100" y="380" width="20" height="156" fill="#b08948"/>
    <rect x="124" y="390" width="22" height="146" fill="#506b5b"/>
    <rect x="150" y="380" width="22" height="156" fill="#3a4a3e"/>
    <rect x="176" y="400" width="18" height="136" fill="#dccfaf"/>
    <rect x="198" y="380" width="22" height="156" fill="#7a5a32"/>
    <rect x="224" y="390" width="20" height="146" fill="#241c14"/>
    <rect x="248" y="380" width="22" height="156" fill="#c8a16a"/>
    <rect x="274" y="400" width="20" height="136" fill="#506b5b"/>
    <rect x="298" y="380" width="22" height="156" fill="#b08948"/>
    <rect x="324" y="390" width="20" height="146" fill="#dccfaf"/>
    <rect x="348" y="380" width="24" height="156" fill="#3a4a3e"/>
    <rect x="376" y="400" width="20" height="136" fill="#7a5a32"/>
