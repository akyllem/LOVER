<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Coastal landscape with cliffs and small harbour">
  <defs>
    <linearGradient id="lsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfdcd1"/>
      <stop offset="1" stop-color="#f3ecdd"/>
    </linearGradient>
    <linearGradient id="lsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8c80"/>
      <stop offset="1" stop-color="#506b5b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1250" fill="url(#lsky)"/>

  <!-- distant ridge -->
  <path d="M0 460 Q160 420 340 440 Q500 410 680 430 Q820 410 1000 430 L1000 540 L0 540 Z" fill="#506b5b" opacity="0.5"/>

  <!-- sea -->
  <rect y="540" width="1000" height="430" fill="url(#lsea)"/>
  <g opacity="0.3" stroke="#f3ecdd" stroke-width="1" fill="none">
    <path d="M0 600 Q500 595 1000 600"/>
    <path d="M0 660 Q500 656 1000 660"/>
    <path d="M0 720 Q500 716 1000 720"/>
    <path d="M0 800 Q500 796 1000 800"/>
    <path d="M0 880 Q500 876 1000 880"/>
  </g>

  <!-- cliff/foreground -->
  <path d="M0 970 L120 950 L280 1000 L480 970 L640 1010 L820 980 L1000 1000 L1000 1250 L0 1250 Z" fill="#1f2e26"/>
  <path d="M0 1080 L1000 1080 L1000 1250 L0 1250 Z" fill="#0e1612"/>

  <!-- sailboats -->
  <g>
    <line x1="350" y1="640" x2="350" y2="700" stroke="#1f2e26" stroke-width="2"/>
    <path d="M334 700 L370 700 L364 715 L340 715 Z" fill="#1f2e26"/>
    <path d="M340 700 L350 640 L350 700 Z" fill="#f3ecdd"/>
    <path d="M350 660 L370 700 L350 700 Z" fill="#dccfaf"/>

    <line x1="700" y1="780" x2="700" y2="850" stroke="#1f2e26" stroke-width="2.4"/>
    <path d="M676 850 L728 850 L720 870 L686 870 Z" fill="#1f2e26"/>
    <path d="M686 850 L700 780 L700 850 Z" fill="#f3ecdd"/>
    <path d="M700 800 L724 850 L700 850 Z" fill="#dccfaf"/>
  </g>

  <!-- harbour pier -->
  <rect x="640" y="1020" width="200" height="14" fill="#7a5a32"/>
  <rect x="650" y="1034" width="6" height="40" fill="#3a3022"/>
  <rect x="700" y="1034" width="6" height="40" fill="#3a3022"/>
  <rect x="750" y="1034" width="6" height="40" fill="#3a3022"/>
  <rect x="810" y="1034" width="6" height="40" fill="#3a3022"/>
  <!-- lantern at end of pier -->
  <rect x="822" y="980" width="4" height="40" fill="#1f1810"/>
  <circle cx="824" cy="976" r="8" fill="#f6d58a"/>

  <!-- foreground tree -->
  <g>
    <rect x="120" y="1000" width="14" height="80" fill="#3a3022"/>
    <ellipse cx="127" cy="990" rx="80" ry="60" fill="#3a4a3e"/>
    <ellipse cx="140" cy="970" rx="60" ry="44" fill="#506b5b"/>
  </g>

  <!-- compass rose / map mark -->
  <g transform="translate(820 1140)">
    <circle r="40" fill="none" stroke="#b08948" stroke-width="1.6"/>
    <circle r="32" fill="none" stroke="#b08948" stroke-width="0.8" opacity="0.6"/>
    <path d="M0 -36 L6 0 L0 36 L-6 0 Z" fill="#b08948"/>
    <path d="M-36 0 L0 6 L36 0 L0 -6 Z" fill="#b08948" opacity="0.5"/>
    <text x="0" y="-46" text-anchor="middle" font-family="serif" font-size="14" fill="#f3ecdd">N</text>
  </g>
</svg>
